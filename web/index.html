<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta
      name="description"
      content="VELOCITY is a local-first cycling app with a playable browser ride, routes and private activity storage."
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>VELOCITY · Cycling, your way</title>

  <body>

        <span class="boot-mark">V</span><strong>VELOCITY</strong
